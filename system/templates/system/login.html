{% extends "system/base_bare.html" %}
{% block main %}
<h1>Sign in</h1>
{% if locked_seconds %}{% include "system/_lockout.html" %}{% endif %}
<form method="post" action="{% url 'login' %}" data-problems data-system-signin style="display:grid;gap:12px">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  {% if error_text %}<p class="sys-note error" data-system-error role="alert" data-problem>{{ error_text }}</p>{% endif %}
  <label>Email <input type="email" name="username" autocomplete="username" {% if not locked_seconds %}autofocus {% endif %}required{% if locked_seconds %} disabled{% endif %}></label>
  <label>Password <input type="password" name="password" autocomplete="current-password" required{% if locked_seconds %} disabled{% endif %}></label>
  <button type="submit" class="sys-btn primary"{% if locked_seconds %} disabled{% endif %}>Sign in</button>
</form>
{% endblock %}
