{# One invite status as a badge. Context: status, label. #}{% if status == "registered" %}<span class="sys-badge ok">{{ label }}</span>{% elif status == "opened" or status == "sending" %}<span class="sys-badge info">{{ label }}</span>{% elif status == "bounced" or status == "failed" %}<span class="sys-badge danger">{{ label }}</span>{% else %}<span class="sys-badge">{{ label }}</span>{% endif %}
