{# The preview link, filled by system-sales.js after "Preview" (POST answers JSON {url, valid_minutes}). Hidden until then. #}
<section class="sys-note ss-link" data-ss-link hidden aria-live="polite">
  <p class="ss-link-head">Preview link</p>
  <div class="ss-link-row"><input type="text" readonly class="mono" data-ss-link-url aria-label="Preview link" value=""><button type="button" class="sys-btn sm" data-ss-link-copy>Copy</button><a class="sys-btn sm" href="#" target="_blank" rel="noopener" data-ss-link-open>Open</a></div>
  <p class="ss-link-note">Only you see the preview, in this browser. The link works for <span data-ss-link-minutes>60</span> minutes.</p>
</section>
