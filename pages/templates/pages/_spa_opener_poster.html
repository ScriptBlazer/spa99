{% comment %}The opener video's poster (its first frame, docs/design/SPA-OPENER.md): the still under the video, and the whole picture with reduced motion or Save-Data. Needs v (opener_video), alt; optional eager.{% endcomment %}<picture>{% if v.poster_portrait != v.poster %}<source media="(max-width: 47.99em)" type="image/webp" srcset="{{ v.poster_portrait }}">{% endif %}<img class="photo" src="{{ v.poster }}" alt="{{ alt }}" loading="{% if eager %}eager{% else %}lazy{% endif %}" decoding="async"{% if eager %} fetchpriority="high"{% endif %}></picture>
