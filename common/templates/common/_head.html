{# Meta tags shared by every page. Pass title, description (optional) and image (optional static path). #}
{% load static %}<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#492E21">
<meta name="color-scheme" content="light">
<script>var d=document.documentElement;d.classList.add("js");if(d.dataset.page==="marketing"&&!matchMedia("(prefers-reduced-motion: reduce)").matches){d.classList.add("motion");setTimeout(function(){if(!d.dataset.scenes)d.classList.remove("motion")},4000)}setTimeout(function(){if(!d.dataset.reveal)d.classList.add("no-reveal")},4000)</script>
<title>{{ title }}</title>
{% if description %}<meta name="description" content="{{ description }}">{% endif %}
<meta property="og:site_name" content="Spa 99">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ title }}">
{% if description %}<meta property="og:description" content="{{ description }}">{% endif %}
{% if request %}<meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'common/img/og.png' %}">{% endif %}
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
{% if request %}<link rel="canonical" href="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">{% endif %}
<link rel="icon" href="{% static 'common/img/mark-gold.svg' %}" type="image/svg+xml">
{% include "common/_assets.html" %}
