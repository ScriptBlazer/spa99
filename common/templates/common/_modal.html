<dialog id="confirm-modal" class="modal" aria-labelledby="confirm-modal-title">
  <h2 class="modal-title" id="confirm-modal-title" data-modal-title></h2>
  <p data-modal-message></p>
  <div class="modal-actions">
    <button type="button" data-modal-cancel>Cancel</button>
    <button type="button" class="modal-confirm" data-modal-confirm>Confirm</button>
  </div>
</dialog>
