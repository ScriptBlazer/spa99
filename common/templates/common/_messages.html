<ul class="messages" id="messages" aria-live="polite">
  {% for message in messages %}
    {% with level=message.level_tag %}
    <li class="message message-{% if level == 'success' or level == 'info' %}success{% else %}error{% endif %}" data-message
        data-level="{% if level == 'success' or level == 'info' %}success{% else %}error{% endif %}"
        role="{% if level == 'success' or level == 'info' %}status{% else %}alert{% endif %}">
      <span>{{ message }}</span>
      <button type="button" class="message-close" data-message-close aria-label="Close message">&times;</button>
    </li>
    {% endwith %}
  {% endfor %}
</ul>
