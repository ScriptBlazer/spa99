{% load office_tags %}<div data-timeline-chunk>
{% for d in timeline_days %}<h3 class="o-subhead" data-timeline-day>{{ d.day|dmy }}</h3>
{% for e in d.items %}<div class="o-tl" data-timeline-item data-kind="{{ e.kind }}"><strong>{% if e.href %}<a href="{{ e.href }}">{{ e.label }}</a>{% else %}{{ e.label }}{% endif %}</strong>{% if e.detail %}<br>{{ e.detail }}{% endif %}<br><small>{{ e.at|dt }}</small></div>{% endfor %}
{% endfor %}
{% if timeline_more %}<a class="btn btn-secondary btn-sm" href="?tl={{ timeline_next }}" hx-get="?tl={{ timeline_next }}" hx-target="closest [data-timeline-chunk]" hx-swap="outerHTML" data-show-earlier>Show earlier</a>{% endif %}
</div>
