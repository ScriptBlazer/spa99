{% for section in sections %}<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td class="e-hair" style="padding:32px 0 16px;border-top:1px solid #E2DDD0;">
<h2 style="margin:0 0 12px;font-family:'Signika','Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif;font-size:18px;line-height:24px;font-weight:500;letter-spacing:-0.45px;color:#492E21;">{{ forloop.counter }}. {{ section.title }}</h2>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">{% for label, value in section.rows %}<tr class="e-row"><td class="e-label e-muted" valign="top" width="40%" style="width:40%;padding:6px 16px 6px 0;font-size:14px;line-height:22px;color:#7B675A;vertical-align:top;">{{ label }}</td><td valign="top" style="padding:6px 0;font-size:15px;line-height:22px;color:#492E21;vertical-align:top;word-break:break-word;">{{ value|linebreaksbr }}</td></tr>{% endfor %}</table>
</td></tr></table>{% endfor %}
