{% load content_tags %}{% comment %}Closes the form column (address line) and adds the picture. See _shell_top.html.{% endcomment %}
      {% if shell.address_line %}<p class="signin-address">{% for part in shell.address_line %}<span>{{ part }}</span>{% endfor %}</p>{% endif %}
    </div>
    {% if shell.has_image %}
    <figure class="signin-pic" data-reveal="hero-image">
      <div class="frame frame--right signin-frame">
        <div class="frame-media">{% photo shell.name alt=shell.alt sizes="(min-width: 64em) 50vw, 100vw" eager=True override=shell.upload %}</div>
        <div class="frame-tint" aria-hidden="true"></div>
      </div>
      <figcaption class="signin-caption">{{ shell.caption }}</figcaption>
    </figure>
    {% endif %}
  </div>
</section>
