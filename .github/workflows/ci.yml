name: CI

on:
  push:
    branches: ["**"]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spa99
          POSTGRES_PASSWORD: spa99
          POSTGRES_DB: spa99
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spa99"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://spa99:spa99@localhost:5432/spa99
      DJANGO_SETTINGS_MODULE: config.settings.test
      SPA99_PRIVATE_DIR: /nonexistent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Deploy checks (prod settings, dummy values; HSTS is off on purpose)
        run: python manage.py check --deploy --settings=config.settings.prod
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          SECRET_KEY: ci-only-Pq7Wm2Xz9Lk4Rt6Vb8Nc1Hd3Jf5Gs0Ya2Ue4Oi6Kp8Wq1Zx3Mv5Bn7Lc9Td
          ADMIN_PATH: ci-only-admin/
          DEFAULT_FROM_EMAIL: "Spa 99 <ci@example.com>"
          SYSTEM_UNLOCK_CODE: "000000"  # dummy, CI only
          AWS_STORAGE_BUCKET_NAME: ci-only-bucket  # dummy: prod refuses to start without a bucket
      - name: Tests
        run: python manage.py test

  build:
    # Version tags only (1.2.3), after the tests pass. Pushes to Docker Hub as <DOCKERHUB_USERNAME>/spa99:<tag>
    # (Moishe, 2026-10-26). Repo secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token).
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/spa99:${{ github.ref_name }}
