{% extends "control/base.html" %}
{% block main %}
<h1 class="ctl-title">Change your password</h1>
<section class="ctl-panel-box ctl-form-panel">
  <form method="post" data-problems novalidate>{% csrf_token %}
    {% for field in form %}<p class="ctl-field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<span class="ctl-error" data-problem data-problem-field="{{ field.html_name }}" data-problem-label="{{ field.label }}">{{ error }}</span>{% endfor %}</p>{% endfor %}
    {% for error in form.non_field_errors %}<p class="ctl-error" data-problem>{{ error }}</p>{% endfor %}
    <button type="submit" class="ctl-btn ctl-btn-primary">Save password</button>
  </form>
</section>
{% endblock %}
