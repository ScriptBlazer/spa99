{% load control_ui %}{% comment %}
The room drawer content. Used twice: for the room named in ?room= (so it works without JavaScript) and once, generic, inside
<template id="ctl-drawer-tpl"> that control.js copies and fills (it removes the parts a room does not have).
{% endcomment %}{% with v=room.v caps=room.caps %}
<div class="ctl-drawer-in" data-room="{% if not generic %}{{ room.slug }}{% endif %}" data-tone="{{ v.tone }}">
  <header class="ctl-drawer-head">
    <div>
      <h2 class="ctl-drawer-title" id="ctl-drawer-title" tabindex="-1" data-f="name">{{ room.name }}</h2>
      <p class="ctl-drawer-meta"><span class="ctl-pill" data-f="badge" data-tone="{{ v.tone }}">{{ v.badge }}</span> <span data-f="people_text">{{ v.people_text }}</span></p>
    </div>
    <a class="ctl-iconbtn" href="{% url 'control_rooms' %}" data-close aria-label="Close">{% include "common/_icon.html" with name="x" %}</a>
  </header>

  <section class="ctl-group" aria-labelledby="g-presets-{{ room.slug }}">
    <h3 id="g-presets-{{ room.slug }}">Presets</h3>
    <div class="ctl-seg" role="radiogroup" aria-label="Preset">{% for p in state.presets %}<label><input type="radio" name="preset" data-f="preset" value="{{ p.key }}"{% if not generic and v.preset == p.key %} checked{% endif %}><span>{{ p.label }}</span></label>{% endfor %}</div>
  </section>

  {% if generic or caps.climate %}<section class="ctl-group" data-cap="climate">
    <h3>{% include "common/_icon.html" with name="thermometer" %}Climate</h3>
    <p class="ctl-hero"><span data-f="cur_text">{{ v.cur_text }}</span></p>
    <div class="ctl-line"><span class="ctl-label">Target</span>
      <span class="ctl-stepper"><button type="button" data-act="target" data-delta="-1" aria-label="Lower target">&minus;</button><span class="ctl-step-val" data-f="target_text">{{ v.target_text }}</span><button type="button" data-act="target" data-delta="1" aria-label="Raise target">+</button></span></div>
    {% if generic or v.hum_text %}<div class="ctl-line" data-cap="humidity"><span class="ctl-label">Humidity <span class="ctl-soft" data-f="hum_text">{{ v.hum_text }}</span></span>
      <span class="ctl-stepper"><button type="button" data-act="hum" data-delta="-5" aria-label="Lower humidity target">&minus;</button><span class="ctl-step-val" data-f="hum_target_text">{{ v.hum_target_text }}</span><button type="button" data-act="hum" data-delta="5" aria-label="Raise humidity target">+</button></span></div>{% endif %}
    <div class="ctl-line"><span class="ctl-label" data-f="heater_label">{% if caps.climate.heater %}{{ caps.climate.heater }}{% else %}Heating{% endif %}</span>
      {% include "control/_toggle.html" with f="heater" checked=room.heater label="Heating" %}</div>
  </section>{% endif %}

  <section class="ctl-group">
    <h3>{% include "common/_icon.html" with name="lightbulb" %}Lights</h3>
    <div class="ctl-line"><span class="ctl-label">Lights</span>{% include "control/_toggle.html" with f="lights_on" checked=room.lights.on label="Lights" %}</div>
    <div class="ctl-line ctl-line-slider"><span class="ctl-label">Brightness</span>{% include "control/_range.html" with f="bright" min=0 max=100 bounds="0,100" value=room.lights.bright vt=v.bright_vt label="Brightness" %}<span class="ctl-val" data-f="bright_num">{{ room.lights.bright }}%</span></div>
    <div class="ctl-line ctl-line-slider"><span class="ctl-label">Warmth</span>{% include "control/_range.html" with f="warmth" min=2200 max=4000 step=100 bounds="2200,4000" value=room.lights.warmth vt=v.warmth_vt label="Warmth" warm=True %}<span class="ctl-val" data-f="warmth_text">{{ v.warmth_text }}</span></div>
  </section>

  {% if generic or caps.music %}<section class="ctl-group" data-cap="music">
    <h3>{% include "common/_icon.html" with name="speaker-high" %}Music</h3>
    <div class="ctl-line"><span class="ctl-label">Music</span>{% include "control/_toggle.html" with f="music_on" checked=room.music.on label="Music" %}</div>
    <div class="ctl-choices" role="radiogroup" aria-label="Playlist">{% for name in state.playlists %}<label class="ctl-choice"><input type="radio" name="playlist" data-f="playlist" value="{{ name }}"{% if not generic and room.music.playlist == name %} checked{% endif %}><span>{{ name }}</span></label>{% endfor %}</div>
    <div class="ctl-line ctl-line-slider"><span class="ctl-label">Volume</span>{% include "control/_range.html" with f="vol" min=0 max=100 bounds="0,100" value=room.music.vol vt=v.vol_vt label="Volume" %}<span class="ctl-val" data-f="vol_text">{{ room.music.vol }}</span></div>
  </section>{% endif %}

  {% if generic or v.screen %}<section class="ctl-group" data-cap="screen">
    <h3>{% include "common/_icon.html" with name="monitor" %}Screen</h3>
    {% if generic %}<div class="ctl-tile-slot" data-tile-slot></div>{% else %}{% include "control/_tile.html" with screen=v.screen %}{% endif %}
    <div class="ctl-choices" role="radiogroup" aria-label="Screen shows">{% for o in options %}<label class="ctl-choice"><input type="radio" name="screen_choice" data-f="screen_choice" value="{{ o.key }}"{% if not generic and v.screen and v.screen.effective == o.key %} checked{% endif %}><span>{{ o.label }}</span></label>{% endfor %}</div>
  </section>{% endif %}

  <p class="ctl-note">Saved in this browser only.</p>
</div>{% endwith %}
