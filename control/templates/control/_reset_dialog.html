<dialog class="ctl-dialog" data-reset-dialog aria-labelledby="ctl-reset-h">
  <form method="dialog">
    <h2 id="ctl-reset-h">Reset demo</h2>
    <p>Put rooms, music and screens back to their starting values? Library files and playlists stay.</p>
    <div class="ctl-dialog-actions">
      <button type="submit" value="cancel" class="ctl-btn">Cancel</button>
      <button type="submit" value="reset" class="ctl-btn ctl-btn-primary" data-reset-confirm>Reset</button>
    </div>
  </form>
</dialog>
